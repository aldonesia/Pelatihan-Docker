version: '3.8'
services:
  db:
    container_name: db
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: always
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: musicapp
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - db-network

  backend:
    container_name: backend
    environment:
      # server configuration
      HOST: 0.0.0.0
      PORT: 5000
      # database configuretion
      PGHOST: db
      PGPORT: 5432
      PGUSER: docker
      PGPASSWORD: docker
      PGDATABASE: musicapp
      # JWT token
      ACCESS_TOKEN_KEY: 8ce5bac4518798d357e4f02dd7a4b3ab0c390c767c4f3e2a21e5e86d0e93656aa9f36bb6f6a50ba823c5c8ee23ea2291571f5335fef285efc3275d4ca612a935
      REFRESH_TOKEN_KEY: a1a233a2b1c985bccdfeb71f5019f8bdfc2a312264ef54f78aa53f16353b6de4938e6782c0505b00d2ca15c5f2e95f204469345a49bf5a8da6500b0df38f3be1
      ACCESS_TOKEN_AGE: 1800
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    volumes:
      - 'backend:/usr/src/backend'
    networks:
      - db-network
      - api-network

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    volumes:
      - 'frontend:/usr/src/frontend'
    networks:
      - web-network

  nginx-frontend:
    container_name: nginx-frontend
    depends_on:
      - frontend
    ports:
      - '6000:80'
    build:
      context: ./nginx
      dockerfile: Dockerfile-frontend
    networks:
      - web-network

  nginx-backend:
    container_name: nginx-backend
    depends_on:
      - backend
    ports:
      - '5000:8080'
    build:
      context: ./nginx
      dockerfile: Dockerfile-backend
    networks:
      - web-network
      - api-network

networks:
  db-network:
    driver: bridge
  web-network:
    driver: bridge
  api-network:
    driver: bridge

volumes:
  db:
    driver: local
  backend:
    driver: local
  frontend:
    driver: local

